<div class="dashboard-controls">
  <mat-form-field appearance="outline">
    <mat-label>Country</mat-label>
    <mat-select [(value)]="selectedCountryCode">
      <mat-option *ngFor="let country of countries" [value]="country.code">
        {{ country.name }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Year</mat-label>
    <mat-select [(value)]="selectedYear">
      <mat-option *ngFor="let year of years" [value]="year">{{ year }}</mat-option>
    </mat-select>
  </mat-form-field>
</div>

<mat-tab-group>
  <mat-tab label="Energy & Emissions">
    <div class="dashboard-grid">
      <div class="row">
        <div class="card">
          <app-renewable-multiline-chart [selectedCountryCode]="selectedCountryCode"></app-renewable-multiline-chart>
        </div>
        <div class="card">
          <app-renewable-bar-race></app-renewable-bar-race>
        </div>
      </div>

      <div class="row">
        <div class="card">
          <app-emissions-sankey [selectedCountryCode]="selectedCountryCode"></app-emissions-sankey>
        </div>
      </div>
    </div>
  </mat-tab>

  <mat-tab label="Forests & Economic Risk">
    <div class="dashboard-grid">
      <div class="row">
        <div class="card">
          <app-forest-carbon-treemap></app-forest-carbon-treemap>
        </div>
        <div class="card">
          <app-income-loss-radar [selectedCountryCode]="selectedCountryCode"></app-income-loss-radar>
        </div>
      </div>
    </div>
  </mat-tab>
</mat-tab-group>
