<!-- app.component.html -->
<main class="main">
  <app-navbar (apiTypeChange)="onApiTypeChange($event)"></app-navbar>
  <div class="container">
    <sidebar
      *ngIf="showSidebar"
      class="sidebar"
      [apiType]="apiType"
      (apiTypeChange)="onApiTypeChange($event)"
      [indicatorType]="indicatorType"
      (indicatorTypeChange)="onIndicatorTypeChange($event)"
      (yearRangeChange)="onYearRangeChange($event)"
      [selectedYear]="selectedYear"
      (selectedYearChange)="onSelectedYearChange($event)"
    >
    </sidebar>

    <div class="content">
      <app-energy-globe
        *ngIf="apiType === 'renewable-energy'"
        [energyType]="indicatorType"
        [selectedYear]="selectedYear"
      >
      </app-energy-globe>

      <app-disaster-globe
        *ngIf="apiType === 'climate-disasters'"
        [indicatorType]="indicatorType"
        [selectedYear]="selectedYear"
      >
      </app-disaster-globe>

      <app-forest-globe
        *ngIf="apiType === 'forest-carbon'"
        [indicatorType]="indicatorType"
        [selectedYear]="selectedYear"
      >
      </app-forest-globe>

      <app-emission-globe
        *ngIf="apiType === 'greenhouse-emissions'"
        [indicatorType]="indicatorType"
        [selectedYear]="selectedYear"
      >
      </app-emission-globe>

      <app-income-globe
        *ngIf="apiType === 'income-loss'"
        [variableType]="indicatorType"
        [selectedYear]="selectedYear"
      >
      </app-income-globe>
    </div>
  </div>
</main>

<router-outlet />
